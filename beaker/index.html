<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fill the Beaker: Year 2 number lab</title>
<style>
:root{
  --ink:#2C2C2C; --ink-soft:#5C5B66; --paper:#fff;
  --cream:#FFFBED; --cream-deep:#FFF4D2; --rule:#E8E4DA;
  --yellow:#FED34C; --coral:#FF6A42; --coral-deep:#B83A17;
  --pink:#FDDCE8; --purple:#968DE2; --purple-deep:#4B3FA8;
  --teal:#40CFCA; --teal-deep:#0B6E6A; --navy:#02426D;
  --r-card:16px; --r-block:22px; --tap:48px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{
  background:var(--cream); color:var(--ink); padding:14px 14px 40px;
  font:500 17px/1.45 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
h1{font:800 30px/1.05 "Archivo Narrow",system-ui,sans-serif;
   text-transform:uppercase;color:var(--coral-deep);letter-spacing:.2px}
.kicker{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
        color:var(--ink-soft);margin-bottom:4px}
header{background:var(--cream-deep);border-radius:var(--r-block);padding:16px 18px;margin-bottom:14px}
.wrap{max-width:860px;margin:0 auto}
.card{background:var(--paper);border-radius:var(--r-card);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:800;border:0;border-radius:999px;
       min-height:var(--tap);padding:12px 20px;background:var(--yellow);color:var(--ink);
       cursor:pointer;transition:transform .12s ease}
button:active{transform:scale(.97)}
button:disabled{opacity:.42;cursor:default}
button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.ghost{background:var(--paper);box-shadow:inset 0 0 0 2px var(--rule)}
.listen{background:var(--purple);color:var(--ink);min-height:var(--tap);
        padding:12px 18px;font-size:15px}
.status{background:var(--pink);border-radius:var(--r-card);padding:14px 16px;
        margin:12px 0;font-weight:700;min-height:56px;display:flex;align-items:center}
.muted{color:var(--ink-soft);font-size:15px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.stage{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:16px;align-items:stretch}
.glass{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:10px;
       min-height:340px;overflow:hidden}
.fluid{position:absolute;left:0;right:0;bottom:0;background:var(--teal);height:0;
       transition:height .45s cubic-bezier(.16,1,.3,1)}
.line{position:absolute;left:0;right:0;border-top:3px dashed var(--coral-deep)}
.line span{position:absolute;right:4px;top:-10px;background:var(--coral-deep);color:#fff;
           font:800 11px/1 "Nunito",sans-serif;padding:4px 7px;border-radius:999px}
.level{position:absolute;left:0;right:0;top:8px;text-align:center;
       font:800 34px/1 "Archivo Narrow",system-ui,sans-serif;color:var(--ink)}
.hand{font-family:"Edu VIC WA NT Beginner","Nunito",sans-serif}
.deal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.deal button{min-height:84px;border-radius:14px;background:var(--cream-deep);
             font:800 24px/1.1 "Nunito",sans-serif;flex-direction:column;display:flex;
             align-items:center;justify-content:center;gap:4px}
.deal button small{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--ink-soft)}
.deal button.cool{background:var(--purple)}
.deal button.drop{background:var(--yellow)}
/* A card that cannot be poured is still a card a child has to read, because
   the reason it cannot be poured is the maths. Greyed out here means quieter,
   not fainter: the text stays at full contrast. */
.deal button:disabled{background:var(--paper);box-shadow:inset 0 0 0 2px var(--rule);
                      color:var(--ink-soft);opacity:1;text-decoration:line-through}
.gap{display:none;margin-top:10px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.keys button{min-height:var(--tap);border-radius:14px;background:var(--paper);
             box-shadow:inset 0 0 0 2px var(--rule);font-size:20px}
.turns{font:800 26px/1 "Archivo Narrow",system-ui,sans-serif;color:var(--coral-deep)}
.trays{display:flex;gap:8px;flex-wrap:wrap}
.trays button{min-height:var(--tap);font-size:15px;background:var(--paper);
              box-shadow:inset 0 0 0 2px var(--rule)}
.trays button[aria-pressed=true]{background:var(--teal);box-shadow:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="kicker">Year 2 · AC9M2N04 · Number lab</div>
  <h1>Fill the beaker</h1>
</header>

<div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <div><span class="muted">Turns left</span> <span class="turns" id="turns">8</span></div>
    <div class="row">
      <button class="listen" id="listen" type="button">Listen</button>
      <button class="ghost" id="again" type="button">Start again</button>
    </div>
  </div>
  <div class="trays" id="trays"></div>
  <div class="stage" style="margin-top:12px">
    <div class="glass" id="glass">
      <div class="fluid" id="fluid"></div>
      <div class="line" id="line"><span id="lineLabel"></span></div>
      <div class="level hand" id="level">0</div>
    </div>
    <div>
      <div class="kicker">Pick one to pour in</div>
      <div class="deal" id="deal"></div>
      <div class="muted" id="hint"></div>
    </div>
  </div>
</div>

<div class="status" id="status">Pick a tray, then pour your first card in.</div>

<div class="card gap" id="gap">
  <div class="kicker">How much more does it need?</div>
  <p style="margin:6px 0 8px"><span class="hand" id="sum" style="font-size:22px"></span></p>
  <div class="keys" id="keys"></div>
  <div class="row" style="margin-top:8px">
    <button id="check" type="button">Check</button>
    <button class="ghost" id="clear" type="button">Clear</button>
  </div>
</div>
</div>

   still finishes the game and still shows up as nought out of eight. */
var tries = 0, firstTime = 0, answered = 0;

function drawTrays(){
  var box = $("trays");
  box.innerHTML = "";
  TRAYS.forEach(function(t){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = t.name + " · to " + t.target;
    b.setAttribute("aria-pressed", t.id === tray.id ? "true" : "false");
    b.onclick = function(){ tray = t; reset(); };
    box.appendChild(b);
  });
}

function paint(){
  $("level").textContent = level;
  $("fluid").style.height = (level / TOP * 100) + "%";
  $("line").style.bottom = (tray.target / TOP * 100) + "%";
  $("lineLabel").textContent = tray.target;
  $("turns").textContent = turns;
}

function deal(){
  hand = [];
  for (var i = 0; i < 3; i++){
    hand.push(tray.cards[Math.floor(Math.random() * tray.cards.length)]);
  }
  var box = $("deal");
  box.innerHTML = "";
  var anyLegal = false;
  hand.forEach(function(card){
    var next = level + card.v;
    var legal = next <= tray.target && next >= 0;
    if (legal) anyLegal = true;
    var b = document.createElement("button");
    b.type = "button";
    b.className = card.v < 0 ? "cool" : (card.name === "DROPPER" ? "drop" : "");
    b.innerHTML = "<span>" + (card.v > 0 ? "+" : "") + card.v + "</span><small>" + card.name + "</small>";
    b.disabled = !legal;
    b.setAttribute("aria-label", card.name + ", " + (card.v > 0 ? "add " : "take away ") +
                   Math.abs(card.v) + (legal ? "" : ", too much to pour"));
    b.onclick = function(){ pour(card); };
    box.appendChild(b);
  });
  $("hint").textContent = anyLegal ? "" :
    "Nothing here fits. This turn is a pass.";
  if (!anyLegal){ speak("over"); }
}

function pour(card){
  var before = level;
  level += card.v;
  paint();
  $("sum").textContent = before + " + " + card.v + " = " + level + ". " + level + " + ___ = " + tray.target;
  typed = "";
  $("gap").style.display = "block";
  say("Now work out how much more the beaker needs.");
  speak("gap");
  $("deal").querySelectorAll("button").forEach(function(b){ b.disabled = true; });
}

function keys(){
  var box = $("keys");
  box.innerHTML = "";
  ["1","2","3","4","5","6","7","8","9","0"].forEach(function(d){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = d;
    b.onclick = function(){ if (typed.length < 3){ typed += d; showTyped(); } };
    box.appendChild(b);
  });
}
function showTyped(){
  $("sum").textContent = $("sum").textContent.replace(/(= *)(\d+|_+)$/, "$1" + (typed || "___"));
  if (!/= *(\d+|_+)$/.test($("sum").textContent)) return;
}

$("check").onclick = function(){
  if (!typed){ say("Tap the numbers to say how much more it needs."); return; }
  var want = tray.target - level;
  tries++;
  if (Number(typed) === want){
    answered++;
    if (tries === 1) firstTime++;
    turns--;
    var score = " (" + firstTime + " of " + answered + " right first time)";
    if (level === tray.target){
      say("Exactly on the line. A perfect fill." + score);
      speak("perfect");
    } else if (turns <= 0){
      say("That is eight turns. Your beaker was short by " + want + "." + score);
      speak("done");
    } else {
      say("Right. " + level + " and " + want + " more makes " + tray.target + "." + score);
      speak("right");
    }
    tries = 0;
    $("gap").style.display = "none";
    paint();
    if (turns > 0 && level !== tray.target) deal();
    else $("deal").innerHTML = "";
  } else {
    /* Say where the liquid is, never how far it is from the line: working out
       the difference is the whole turn. */
    say("Not quite. The beaker is on " + level + ". Count up from there to " + tray.target + ".");
    speak("wrong");
    typed = "";
    showTyped();
  }
};
$("clear").onclick = function(){ typed = ""; showTyped(); };

function reset(){
  level = 0; turns = 8; typed = "";
  tries = 0; firstTime = 0; answered = 0;
  $("gap").style.display = "none";
  say("Pick a card to pour in.");
  drawTrays(); paint(); deal();
}

$("again").onclick = reset;
$("listen").onclick = function(){ speak(level === 0 ? "intro" : "howto"); };
keys();
reset();
</script>
</body>
</html>
