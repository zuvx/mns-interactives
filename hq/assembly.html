<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Quest: Results</title>
<link rel="stylesheet" href="quest.css">
</head>
<body class="assembly-page">
<div class="wrap">
  <p class="demo">
    <span><strong>Demo.</strong> Every number on this page is made up.</span>
    <span class="demo-links">
      <a class="demo-link" href="school.html">School mode</a>
      <a class="demo-link" href="staff.html">Staff view</a>
    </span>
  </p>

  <header class="head">
    <div class="head-mark" id="crest"></div>
    <div>
      <h1>Who took the school?</h1>
      <p class="sub">House Quest &middot; Junior school &middot; Week 5 results</p>
    </div>
  </header>

  <main class="assembly">
    <canvas id="plan" class="plan" role="img" aria-label="Plan of the school. Each zone fills with the colour of the house that took it."></canvas>
    <aside class="reveal-side">
      <p class="reveal-text" id="revealText" aria-live="polite">Ten zones, ten questions. Which house took each one?</p>
      <button class="btn reveal-btn" id="revealBtn" type="button">Reveal the first zone</button>
      <div class="cup-panel" id="cupPanel" hidden>
        <div class="cup-art"><span id="cupWafi" aria-hidden="true"></span><span id="cupCrest" aria-hidden="true"></span></div>
        <p class="cup-winner" id="cupWinner" aria-live="polite"></p>
        <ol class="cup-list" id="cupList"></ol>
      </div>
    </aside>
  </main>
</div>
<script src="mns-art.js"></script>
<script src="school-map.js"></script>
<script src="assembly.js"></script>
</body>
</html>
