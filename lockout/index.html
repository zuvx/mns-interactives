<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOCKOUT: Year 5 code breaking</title>
<style>
:root{
  --ink:#2C2C2C; --ink-soft:#5C5B66; --paper:#fff;
  --cream:#FFFBED; --cream-deep:#FFF4D2; --rule:#E8E4DA;
  --yellow:#FED34C; --coral:#FF6A42; --coral-deep:#B83A17;
  --pink:#FDDCE8; --purple:#968DE2; --purple-deep:#4B3FA8;
  --teal:#40CFCA; --teal-deep:#0B6E6A; --navy:#02426D;
  --r-card:16px; --r-block:22px; --tap:48px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{
  background:var(--cream); color:var(--ink); padding:14px 14px 40px;
  font:500 17px/1.45 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
h1{font:800 30px/1.05 "Archivo Narrow",system-ui,sans-serif;
   text-transform:uppercase;color:var(--coral-deep);letter-spacing:.2px}
.kicker{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
        color:var(--ink-soft);margin-bottom:4px}
header{background:var(--cream-deep);border-radius:var(--r-block);padding:16px 18px;margin-bottom:14px}
.wrap{max-width:860px;margin:0 auto}
.card{background:var(--paper);border-radius:var(--r-card);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:800;border:0;border-radius:999px;
       min-height:var(--tap);padding:12px 20px;background:var(--yellow);color:var(--ink);
       cursor:pointer;transition:transform .12s ease}
button:active{transform:scale(.97)}
button:disabled{opacity:.42;cursor:default}
button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.ghost{background:var(--paper);box-shadow:inset 0 0 0 2px var(--rule)}
.listen{background:var(--purple);color:var(--ink);min-height:var(--tap);
        padding:12px 18px;font-size:15px}
.status{background:var(--pink);border-radius:var(--r-card);padding:14px 16px;
        margin:12px 0;font-weight:700;min-height:56px;display:flex;align-items:center}
.muted{color:var(--ink-soft);font-size:15px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.pad button{min-height:0;aspect-ratio:1;padding:0;border-radius:14px;background:var(--paper);
            box-shadow:inset 0 0 0 2px var(--rule);
            font:800 clamp(17px,4.4vw,26px)/1 "Archivo Narrow",system-ui,sans-serif;color:var(--ink)}
/* A crossed-out number still has to be readable. A child checking their own
   work reads the numbers they have already ruled out as often as the ones they
   have not, so this is greyed, not faded away. */
.pad button.out{background:var(--cream-deep);color:var(--ink-soft);
                text-decoration:line-through;opacity:1}
/* What they have crossed this turn, before they commit to it. */
.pad button.mark{background:var(--coral);color:var(--ink);opacity:1;
                 box-shadow:inset 0 0 0 3px var(--coral-deep);text-decoration:line-through}
.pad button.win{background:var(--yellow);color:var(--ink);box-shadow:inset 0 0 0 3px var(--coral-deep)}
.pad button:disabled{opacity:1}
.clues{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.clues button{min-height:var(--tap);text-align:left;padding:12px 14px;border-radius:14px;
              background:var(--cream-deep);font-size:15px;font-weight:700;line-height:1.25}
.clues button.used{background:var(--paper);box-shadow:inset 0 0 0 2px var(--rule);color:var(--ink-soft)}
.count{font:800 26px/1 "Archivo Narrow",system-ui,sans-serif;color:var(--coral-deep)}
#disarm{display:none;margin-top:12px}
input[type=text]{font:inherit;font-size:20px;font-weight:800;padding:12px 14px;border-radius:14px;
                 border:2px solid var(--rule);width:100%;min-height:var(--tap);background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="kicker">Year 5 · AC9M5N02 · Number lock safe</div>
  <h1>Lockout</h1>
</header>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <div><span class="muted">Questions asked</span> <span class="count" id="asked">0</span></div>
    <div class="row">
      <button class="listen" id="listen" type="button">Listen</button>
      <button class="ghost" id="again" type="button">New code</button>
    </div>
  </div>
  <div class="pad" id="pad"></div>
  <div class="row" id="crossRow" style="display:none;margin-top:4px">
    <button id="done" type="button">I have crossed them all out</button>
    <button class="ghost" id="undo" type="button">Undo</button>
  </div>
</div>

<div class="status" id="status">Tap a clue card to ask a question.</div>

<div class="card" id="cluesCard">
  <div class="kicker">Clue cards</div>
  <div class="clues" id="clues"></div>
</div>

<div class="card" id="disarm">
  <div class="kicker">Disarm the alarm</div>
  <p class="muted" style="margin:6px 0 10px">Write the code as a product of its factors,
     with a space between each one.</p>
  <input type="text" id="factors" inputmode="numeric" autocomplete="off"
         aria-label="the code written as a product of its factors" placeholder="2 2 3">
  <div class="row" style="margin-top:10px">
    <button id="check" type="button">Check it</button>
  </div>
</div>
</div>

var playing = null;
function $(id){ return document.getElementById(id); }
function speak(key){
  if (!CLIPS[key]) return;
  if (playing) { playing.pause(); playing = null; }
  playing = new Audio(CLIPS[key]);
  playing.play().catch(function(){ /* a tablet that refuses audio still plays the game */ });
}
function say(msg){ var el = $("status"); if (el) el.textContent = msg; }

var PAD = [10,12,14,15,16,18,20,25,27,28,30,35,36,42,45,49,53,54,56,60,63,64,65,70,72,74,76,77,78,80,81,84,87,88,90,96];
var CARDS = [{"id":1,"q":"Is it a multiple of 2?","strand":"multiples","yes":[10,12,14,16,18,20,28,30,36,42,54,56,60,64,70,72,74,76,78,80,84,88,90,96]},{"id":2,"q":"Is it a multiple of 3?","strand":"multiples","yes":[12,15,18,27,30,36,42,45,54,60,63,72,78,81,84,87,90,96]},{"id":3,"q":"Is it a multiple of 5?","strand":"multiples","yes":[10,15,20,25,30,35,45,60,65,70,80,90]},{"id":4,"q":"Is it a multiple of 4?","strand":"multiples","yes":[12,16,20,28,36,56,60,64,72,76,80,84,88,96]},{"id":5,"q":"Is it divisible by 9?","strand":"divisibility","yes":[18,27,36,45,54,63,72,81,90]},{"id":6,"q":"Is 7 one of its factors?","strand":"factors","yes":[14,28,35,42,49,56,63,70,77,84]},{"id":7,"q":"Is it divisible by 10?","strand":"divisibility","yes":[10,20,30,60,70,80,90]},{"id":8,"q":"Does it have exactly two factors?","strand":"factors","yes":[53]},{"id":9,"q":"Is it a square number?","strand":"factors","yes":[16,25,36,49,64,81]},{"id":10,"q":"Does it have more than six factors?","strand":"factors","yes":[30,36,42,54,56,60,64,70,72,78,80,84,88,90,96]},{"id":11,"q":"Is it a multiple of both 2 and 3?","strand":"multiples","yes":[12,18,30,36,42,54,60,72,78,84,90,96]},{"id":12,"q":"Can it be written as 2 x 2 x something?","strand":"products","yes":[12,16,20,28,36,56,60,64,72,76,80,84,88,96]}];
var secret = null, live = [], asked = 0, usedCards = [];

/* The board is only ever narrowed by the student.

   The first version of this page crossed the numbers out itself as soon as the
   setter answered. That turned the game into tapping twelve cards in order:
   the code appeared at the end and nobody had divided anything. So now the
   page answers yes or no, and then the student has to find every number that
   answer rules out and cross it out by hand, exactly as they would on the
   printed keypad. Deciding whether 63 is a multiple of 4 is the lesson, and
   that decision has to be theirs thirty-five times a game. */
var pending = null;          // the card just answered, while crossing out
var marked = [];             // what the student has crossed this turn

function draw(){
  var pad = $("pad");
  pad.innerHTML = "";
  PAD.forEach(function(n){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = n;
    var alive = live.indexOf(n) >= 0;
    var justMarked = marked.indexOf(n) >= 0;
    b.className = justMarked ? "mark" : (alive ? "" : "out");
    if (!pending && live.length === 1 && alive) b.className = "win";
    b.setAttribute("aria-label", n + (justMarked ? ", crossed out this turn"
                                                 : (alive ? "" : ", crossed out")));
    /* Live numbers are tappable only while there is an answer to act on. */
    b.disabled = !pending || !alive;
    if (pending && alive) b.onclick = function(){ toggle(n); };
    pad.appendChild(b);
  });
  $("asked").textContent = asked;
}

function toggle(n){
  var at = marked.indexOf(n);
  if (at >= 0) marked.splice(at, 1); else marked.push(n);
  draw();
}

function drawClues(){
  var box = $("clues");
  box.innerHTML = "";
  CARDS.forEach(function(c){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = c.q;
    b.className = usedCards.indexOf(c.id) >= 0 ? "used" : "";
    b.disabled = !!pending;                 // finish crossing out first
    b.onclick = function(){ ask(c); };
    box.appendChild(b);
  });
}

function ask(card){
  if (live.length <= 1 || pending) return;
  var answer = card.yes.indexOf(secret) >= 0;
  asked++;
  if (usedCards.indexOf(card.id) < 0) usedCards.push(card.id);
  pending = { card: card, answer: answer };
  marked = [];
  $("crossRow").style.display = "flex";
  say((answer ? "Yes." : "No.") + " Now cross out every number on the keypad that this rules out.");
  speak("howto");
  draw();
  drawClues();
}

$("done").onclick = function(){
  if (!pending) return;
  /* What the answer really rules out. The page knows; it just will not do it
     for them. */
  var shouldGo = live.filter(function(n){
    return (pending.card.yes.indexOf(n) >= 0) !== pending.answer;
  });
  var wrongly = marked.filter(function(n){ return shouldGo.indexOf(n) < 0; });
  var missed = shouldGo.filter(function(n){ return marked.indexOf(n) < 0; });

  if (wrongly.length || missed.length){
    /* Say how many, never which: finding them is the work. */
    var parts = [];
    if (missed.length) parts.push(missed.length + " still to cross out");
    if (wrongly.length) parts.push(wrongly.length + " that should stay");
    say("Not yet. There " + (parts.length === 1 && (missed.length === 1 || wrongly.length === 1)
        ? "is " : "are ") + parts.join(" and ") + ". Check them against the question.");
    return;
  }

  live = live.filter(function(n){ return marked.indexOf(n) < 0; });
  var gone = marked.length;
  pending = null;
  marked = [];
  $("crossRow").style.display = "none";

  if (gone === 0){
    say("Correct: that question crossed nothing off, because everything left answers it the " +
        "same way. It cost you a turn.");
    speak("wasted");
  } else if (live.length === 1){
    say("All correct. One number left, and that is the code.");
    speak("one");
    $("disarm").style.display = "block";
  } else {
    say("All correct. " + gone + " crossed off, " + live.length + " left.");
    if (gone >= live.length) speak("narrow");
  }
  draw();
  drawClues();
};

$("undo").onclick = function(){ marked = []; draw(); };

function reset(){
  secret = PAD[Math.floor(Math.random() * PAD.length)];
  live = PAD.slice();
  asked = 0;
  usedCards = [];
  pending = null;
  marked = [];
  $("crossRow").style.display = "none";
  $("disarm").style.display = "none";
  $("factors").value = "";
  say("Tap a clue card to ask a question.");
  draw();
  drawClues();
}

$("check").onclick = function(){
  var parts = $("factors").value.split(/[^0-9]+/).filter(Boolean).map(Number);
  if (!parts.length) { say("Write the factors first, with a space between each one."); return; }
  var product = parts.reduce(function(a, b){ return a * b; }, 1);
  if (product === secret && parts.length > 1 && parts.every(function(p){ return p > 1; })){
    say("Open. " + secret + " = " + parts.join(" x ") + ". You found it in " + asked + " questions.");
    speak("open");
  } else if (product === secret){
    say("That multiplies to " + secret + ", but a product needs more than one factor, and none of them can be 1.");
    speak("wrong");
  } else {
    say(parts.join(" x ") + " makes " + product + ", and the code is " + secret + ". Try again.");
    speak("wrong");
  }
};

$("again").onclick = reset;
$("listen").onclick = function(){ speak(live.length === PAD.length ? "intro" : "howto"); };
reset();
</script>
